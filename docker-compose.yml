services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Pulls the model once, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:3b}"]
    volumes:
      - ollama:/root/.ollama

  backend:
    build: ./backend
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /app/data
    volumes:
      - backend-data:/app/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  ollama:
  backend-data:
